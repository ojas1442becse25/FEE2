<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Page</title>

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    background:linear-gradient(135deg,#5b8fe8,#6fc3ff);
    overflow:hidden;
}

/* Navbar */
nav{
    position:absolute;
    top:0;
    left:0;
    width:100%;
    padding:20px 70px;
    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    color:#fff;
    font-size:28px;
    font-weight:bold;
}

nav ul{
    display:flex;
    list-style:none;
}

nav ul li{
    margin-left:35px;
}

nav ul li a{
    text-decoration:none;
    color:#fff;
    font-size:17px;
}

/* Background Circles */
.circle{
    position:absolute;
    border-radius:50%;
    filter:blur(3px);
}

.red{
    width:220px;
    height:220px;
    background:#ff8b8b;
    left:120px;
    top:170px;
    box-shadow:0 0 35px rgba(255,255,255,.8);
}

.white{
    width:170px;
    height:170px;
    background:#fff;
    right:130px;
    bottom:120px;
    box-shadow:0 0 35px rgba(255,255,255,.9);
}

/* Login Box */
.login-box{
    width:380px;
    padding:35px;
    text-align:center;
    border-radius:18px;
    background:rgba(255,255,255,.18);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.3);
    box-shadow:0 8px 25px rgba(0,0,0,.2);
    position:relative;
}

.close{
    position:absolute;
    right:15px;
    top:10px;
    color:#fff;
    font-size:20px;
    cursor:pointer;
}

.login-box h1{
    color:#fff;
    margin-bottom:8px;
}

.login-box p{
    color:white;
    margin-bottom:20px;
    font-size:14px;
}

.input-box{
    position:relative;
    margin:15px 0;
}

.input-box input{
    width:100%;
    padding:13px 15px;
    border:none;
    border-radius:8px;
    outline:none;
    font-size:15px;
}

.input-box i{
    position:absolute;
    right:15px;
    top:14px;
    color:#666;
}

button{
    width:100%;
    padding:13px;
    border:none;
    border-radius:8px;
    background:#e58d78;
    color:#fff;
    font-size:16px;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#d8745a;
}

.forgot{
    display:block;
    margin-top:18px;
    color:#fff;
    text-decoration:none;
    font-size:14px;
}

.signup{
    margin-top:12px;
    color:#fff;
    font-size:14px;
}

.signup a{
    color:#ffd34d;
    text-decoration:none;
    font-weight:bold;
}
</style>

</head>
<body>

<nav>
    <div class="logo">CodeVerse</div>

    <ul>
        <li><a href="#">Home</a></li>
        <li><a href="#">Courses</a></li>
        <li><a href="#">About</a></li>
    </ul>
</nav>

<div class="circle red"></div>
<div class="circle white"></div>

<div class="login-box">

    <span class="close">&times;</span>

    <h1>Welcome Back</h1>
    <p>Login to continue</p>

    <div class="input-box">
        <input type="email" placeholder="Email">
    </div>

    <div class="input-box">
        <input type="password" placeholder="Password">
        <i class="fa-solid fa-eye"></i>
    </div>

    <button>Login</button>

    <a href="#" class="forgot">Forgot Password?</a>

    <div class="signup">
        Don't have an account?
        <a href="#">Sign Up</a>
    </div>

</div>

</body>
</html>
